# GreenUniMind — isolated nginx site config
# Copy to: /etc/nginx/sites-available/greenunimind.conf
# Enable:  ln -s /etc/nginx/sites-available/greenunimind.conf /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name www.greenunimind.com greenunimind.com;

    # Certbot will add HTTPS redirect after SSL is issued
    root /var/www/greenunimind/frontend/dist;
    index index.html;

    access_log /var/log/nginx/greenunimind-access.log;
    error_log  /var/log/nginx/greenunimind-error.log;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API → Node backend (localhost only — not exposed directly)
    location /api/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        client_max_body_size 50M;
    }

    # Uploaded files served by Express
    location /uploads/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check (optional direct path)
    location /health {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
    }

    # Static assets with cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React SPA — all routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deny hidden files
    location ~ /\. {
        deny all;
    }
}
